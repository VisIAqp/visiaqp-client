<header
  class="print:hidden box-border flex min-h-20 items-center justify-between gap-3 border-0 border-b border-solid border-border bg-white p-4 desktop:h-20 desktop:px-7 desktop:py-0"
>
  <div class="min-w-0">
    <h1 class="m-0 text-title text-content">{{ titulo }}</h1>
    <p class="mt-1 mb-0 text-label text-muted">Consulta de datos del sistema</p>
  </div>
  <div class="flex shrink-0 items-center gap-3">
    <div class="hidden flex-col desktop:flex">
      <span class="text-sm font-semibold"
        >{{ auth.user()?.nombres }} {{ auth.user()?.apellidos }}</span
      ><span class="text-xs text-subtle">{{ auth.role() }}</span>
    </div>
    <button
      type="button"
      class="ui-focus cursor-pointer rounded-lg border border-solid border-field bg-white px-4 py-2 disabled:cursor-default disabled:opacity-45"
      (click)="auth.logout()"
    >
      Salir
    </button>
  </div>
</header>
