<h2 class="m-0 mb-1.5 px-3 text-caption font-semibold tracking-[.04em]! text-on-dark!">{{ titulo() }}</h2>
<ul class="m-0 grid list-none gap-1 p-0 desktop:gap-1.5" role="list">
  @for (enlace of enlaces(); track enlace.ruta) {
    <li>
      <a
        class="box-border flex min-h-11 items-center gap-1.5 rounded-lg p-2 text-label font-normal
          text-on-dark no-underline transition-colors duration-200 hover:bg-white/10 hover:text-white
          aria-[current=page]:bg-brand aria-[current=page]:text-white
          focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-white desktop:gap-3 desktop:p-3"
        [routerLink]="enlace.ruta"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="navegar.emit($event)"
      >
        <svg class="size-4.5 shrink-0" aria-hidden="true" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path [attr.d]="enlace.icono" />
        </svg>
        {{ enlace.etiqueta }}
      </a>
    </li>
  }
</ul>
