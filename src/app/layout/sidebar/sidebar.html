<aside
  class="print:hidden relative box-border flex w-full flex-col overflow-y-auto bg-sidebar p-3 text-white desktop:fixed desktop:top-0 desktop:left-0 desktop:z-[1000] desktop:h-dvh desktop:w-sidebar desktop:px-4 desktop:py-6"
>
  <div class="flex items-center justify-between gap-3 desktop:block">
    <div class="flex min-w-0 items-center gap-3 text-title font-bold desktop:px-3 desktop:pb-5">
      <span aria-hidden="true" class="flex size-9.5 shrink-0 items-center justify-center rounded-panel bg-brand">V</span>
      <span>VisIAqp</span>
    </div>
    <button
      #menuToggle
      type="button"
      class="flex size-11 shrink-0 cursor-pointer items-center justify-center rounded-lg border border-solid border-white/30 bg-transparent text-white hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white desktop:hidden"
      aria-controls="menu-principal"
      [attr.aria-expanded]="menuAbierto()"
      [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="menuAbierto.set(!menuAbierto())"
    >
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path [attr.d]="menuAbierto() ? 'm6 6 12 12M18 6 6 18' : 'M4 6h16M4 12h16M4 18h16'" />
      </svg>
    </button>
  </div>

  <div id="menu-principal" class="mt-3 flex-1 flex-col gap-5 desktop:mt-0 desktop:flex"
    [class.hidden]="!menuAbierto()" [class.flex]="menuAbierto()">
    <nav class="grid gap-5" aria-label="Navegación principal">
      <app-sidebar-nav-group titulo="Operación" [enlaces]="operacion"
        (navegar)="cerrarTrasNavegar($event)" />
      <app-sidebar-nav-group titulo="Análisis" [enlaces]="analisis"
        (navegar)="cerrarTrasNavegar($event)" />
      <app-sidebar-nav-group [titulo]="puedeConfigurar() ? 'Configuración' : 'Catálogos'"
        [enlaces]="catalogos" (navegar)="cerrarTrasNavegar($event)" />
    </nav>

    @if (usuario() || rol()) {
      <footer class="mt-auto border-0 border-t border-solid border-white/12 pt-3.5">
        <div class="grid gap-0.5 px-3 wrap-anywhere text-label">
          @if (usuario(); as nombre) { <span class="font-semibold">{{ nombre }}</span> }
          @if (rol(); as perfil) { <span class="text-caption text-dimmed">{{ perfil }}</span> }
        </div>
        <button
          type="button"
          class="mt-2 flex min-h-11 w-full cursor-pointer items-center gap-2 rounded-control border-0 bg-transparent px-3 text-start text-label text-on-dark hover:bg-white/8 hover:text-white focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-brand-soft"
          (click)="cerrarSesion.emit()"
        >
          <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5m5-12 4 4-4 4m-6-4h10" />
          </svg>
          Cerrar sesión
        </button>
      </footer>
    }
  </div>
</aside>
