<aside
  class="box-border relative flex w-full flex-col overflow-y-auto bg-content p-3 text-white desktop:fixed desktop:top-0 desktop:left-0 desktop:z-[1000] desktop:h-screen desktop:min-h-screen desktop:w-sidebar desktop:px-4 desktop:py-6"
>
  <div class="flex items-center justify-between gap-3 desktop:block">
    <div class="flex items-center gap-3 text-title font-bold desktop:px-3 desktop:pb-7.5">
      <div
        class="flex size-9.5 shrink-0 items-center justify-center rounded-panel bg-white text-content"
      >
        V
      </div>
      <span>VisIAqp</span>
    </div>
    <button
      #menuToggle
      type="button"
      class="flex size-11 shrink-0 cursor-pointer items-center justify-center rounded-lg border border-solid border-white/30 bg-transparent text-white hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white desktop:hidden"
      aria-controls="menu-principal"
      [attr.aria-expanded]="menuAbierto()"
      [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="menuAbierto.set(!menuAbierto())"
    >
      @if (menuAbierto()) {
        <svg
          aria-hidden="true"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      } @else {
        <svg
          aria-hidden="true"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      }
    </button>
  </div>

  <nav
    aria-label="Navegación principal"
    id="menu-principal"
    [ngClass]="menuAbierto() ? 'flex' : 'hidden'"
    class="mt-3 flex-col gap-1 desktop:mt-0 desktop:flex desktop:gap-1.5"
  >
    <a
      class="flex items-center gap-1.5 rounded-lg p-2 text-on-dark no-underline transition-colors duration-200 hover:bg-white hover:text-content aria-[current=page]:bg-white aria-[current=page]:text-content focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-white desktop:gap-3 desktop:p-3"
      routerLink="/dashboard"
      (click)="menuAbierto.set(false)"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <span>⌂</span>
      <span>Dashboard</span>
    </a>

    <a
      class="flex items-center gap-1.5 rounded-lg p-2 text-on-dark no-underline transition-colors duration-200 hover:bg-white hover:text-content aria-[current=page]:bg-white aria-[current=page]:text-content focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-white desktop:gap-3 desktop:p-3"
      routerLink="/zonas"
      (click)="menuAbierto.set(false)"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <span>◉</span>
      <span>Zonas</span>
    </a>

    <a
      class="flex items-center gap-1.5 rounded-lg p-2 text-on-dark no-underline transition-colors duration-200 hover:bg-white hover:text-content aria-[current=page]:bg-white aria-[current=page]:text-content focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-white desktop:gap-3 desktop:p-3"
      routerLink="/camaras"
      (click)="menuAbierto.set(false)"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <span>▣</span>
      <span>Cámaras</span>
    </a>

    <a
      class="flex items-center gap-1.5 rounded-lg p-2 text-on-dark no-underline transition-colors duration-200 hover:bg-white hover:text-content aria-[current=page]:bg-white aria-[current=page]:text-content focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-white desktop:gap-3 desktop:p-3"
      routerLink="/monitoreo"
      (click)="menuAbierto.set(false)"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <span>◉</span>
      <span>Monitoreo</span>
    </a>

    <a
      class="flex items-center gap-1.5 rounded-lg p-2 text-on-dark no-underline transition-colors duration-200 hover:bg-white hover:text-content aria-[current=page]:bg-white aria-[current=page]:text-content focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-white desktop:gap-3 desktop:p-3"
      routerLink="/analisis"
      (click)="menuAbierto.set(false)"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <span>▥</span>
      <span>Análisis</span>
    </a>

    <a
      class="flex items-center gap-1.5 rounded-lg p-2 text-on-dark no-underline transition-colors duration-200 hover:bg-white hover:text-content aria-[current=page]:bg-white aria-[current=page]:text-content focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-white desktop:gap-3 desktop:p-3"
      routerLink="/reportes"
      (click)="menuAbierto.set(false)"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <span>▤</span>
      <span>Reportes</span>
    </a>
  </nav>

  <div class="mt-auto hidden px-3 pt-3.75 text-label text-dimmed desktop:block">
    <span class="mr-2 inline-block size-2 rounded-full bg-online"></span>
    Modo de prueba
  </div>
</aside>
