<div class="mx-auto grid min-w-0 max-w-page gap-5">
  <app-solicitud-video
    [videos]="videos()" [camaras]="camaras()" [catalogo]="catalogoRequest" [envio]="envioRequest"
    (solicitar)="solicitar($event)" (recargarCatalogo)="cargarCatalogo()" />

  <app-seguimiento-videos
    [filas]="ejecucionesVisibles" [camaras]="camaras()" [consulta]="ejecucionesRequest" [cancelacion]="cancelacionRequest"
    [puedeCancelar]="puedeCancelar" [destacada]="destacada()" [mensaje]="mensajeSeguimiento()"
    [pagina]="paginaEjecuciones" [paginas]="paginasEjecuciones" [total]="procesamientos.length"
    [filtroEstado]="filtroEstado" (filtroEstadoChange)="filtroEstado = $event; refrescar(true)"
    [filtroCamara]="filtroCamara" (filtroCamaraChange)="filtroCamara = $event; refrescar(true)"
    (reintentar)="refrescar()" (cambiarPagina)="cambiarPagina($event)" (cancelar)="cancelar($event)" />

  <a routerLink="/reportes" class="ui-focus w-fit rounded-sm text-label font-semibold text-brand no-underline hover:underline">
    Consultar indicadores por zona en Reportes <span aria-hidden="true">→</span>
  </a>
</div>
