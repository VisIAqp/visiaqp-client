<div class="flex flex-wrap items-center gap-x-3 gap-y-2">
  <div class="inline-flex max-w-full gap-0.5 rounded-lg border border-solid border-field bg-canvas p-0.5"
    role="group" aria-label="Agrupación del gráfico">
    @for (opcion of agrupaciones; track opcion.valor) {
      <button type="button" class="ui-focus cursor-pointer rounded-md border-0 px-3 py-2 text-label font-medium"
        [class]="agrupacion() === opcion.valor ? 'bg-brand-soft text-brand' : 'bg-transparent text-muted hover:text-content'"
        [attr.aria-pressed]="agrupacion() === opcion.valor" (click)="agrupacionChange.emit(opcion.valor)">
        {{ opcion.nombre }}
      </button>
    }
  </div>
  <div class="inline-flex max-w-full gap-0.5 rounded-lg border border-solid border-field bg-canvas p-0.5"
    role="group" aria-label="Rango del gráfico">
    @for (opcion of vistas; track opcion.valor) {
      <button type="button" class="ui-focus cursor-pointer rounded-md border-0 px-3 py-2 text-label font-medium"
        [class]="vista() === opcion.valor ? 'bg-brand-soft text-brand' : 'bg-transparent text-muted hover:text-content'"
        [attr.aria-pressed]="vista() === opcion.valor" (click)="vistaChange.emit(opcion.valor)">
        {{ opcion.nombre }}
      </button>
    }
  </div>
</div>

<div class="mt-3 grid grid-cols-2 items-end gap-2 sm:flex sm:flex-wrap">
  <label class="grid min-w-0 gap-1 text-caption font-medium text-muted sm:w-36">
    Zona
    <select class="ui-field min-h-10 w-full text-label" [ngModel]="zona()" (ngModelChange)="zonaChange.emit($event)">
      <option [ngValue]="0">Todas las zonas</option>
      @for (item of zonas(); track item.id) { <option [ngValue]="item.id">{{ item.nombre }}</option> }
    </select>
  </label>
  @if (agrupacion() === 'camara') {
    <label class="grid min-w-0 gap-1 text-caption font-medium text-muted sm:w-36">
      Cámara
      <select class="ui-field min-h-10 w-full text-label" [ngModel]="camara()" (ngModelChange)="camaraChange.emit($event)">
        <option [ngValue]="0">Todas las cámaras</option>
        @for (item of camarasDisponibles(); track item.id) { <option [ngValue]="item.id">{{ item.nombre }}</option> }
      </select>
    </label>
  }

  @if (vista() === 'historico') {
    <form class="col-span-2 grid grid-cols-2 items-end gap-2 sm:flex sm:flex-wrap" (ngSubmit)="aplicarOpciones()">
      <label class="grid min-w-0 gap-1 text-caption font-medium text-muted sm:w-32">
        Desde
        <input class="ui-field min-h-10 w-full text-label" type="date" name="desde" required
          [ngModel]="borrador().desde" (ngModelChange)="editar('desde', $event)" />
      </label>
      <label class="grid min-w-0 gap-1 text-caption font-medium text-muted sm:w-32">
        Hasta
        <input class="ui-field min-h-10 w-full text-label" type="date" name="hasta" required
          [ngModel]="borrador().hasta" (ngModelChange)="editar('hasta', $event)" />
      </label>
      <label class="grid min-w-0 gap-1 text-caption font-medium text-muted sm:w-24">
        Intervalo
        <select class="ui-field min-h-10 w-full text-label" name="periodo"
          [ngModel]="borrador().periodo" (ngModelChange)="editar('periodo', $event)">
          <option value="hora">Hora</option>
          <option value="dia">Día</option>
        </select>
      </label>
      <button type="submit" class="ui-focus min-h-10 cursor-pointer justify-self-start rounded-lg border-0 bg-brand px-3 py-2 text-label font-semibold text-white hover:bg-brand-hover disabled:cursor-default disabled:bg-canvas disabled:text-muted"
        [disabled]="!pendiente()">Aplicar</button>
    </form>
  }
</div>

@if (vista() === 'historico' && error()) { <p class="mt-2 mb-0 text-label text-danger" role="alert">{{ error() }}</p> }
